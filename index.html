<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Quizly — دروس ترم تابستان</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --brand: #fb5180;
  --brand-2: #ff7fa0;
  --bg: #0a0a0f;
  --card: rgba(255,255,255,0.03);
  --muted: #8a8a8a;
  --text: #e9e9ea;
  --maxw: 980px;
  --shadow-1: 0 10px 30px rgba(0,0,0,0.6);
  --accent: 0 14px 40px rgba(251,81,128,0.12);
  --ease: cubic-bezier(.2,.9,.2,1);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  height: 100%;
}

body {
  font-family: "Vazirmatn", system-ui, -apple-system, sans-serif;
  background:
    radial-gradient(900px 420px at 8% 12%, rgba(251, 81, 128, 0.06), transparent 60%),
    radial-gradient(700px 360px at 92% 88%, rgba(255, 127, 160, 0.04), transparent 60%),
    #0a0a0f;
  color: var(--text);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  padding: 22px 14px;
  transition: background .35s var(--ease), color .35s var(--ease);
  min-height: 100vh;
}

/* Header */
.header {
  position: sticky;
  top: 14px;
  width: 100%;
  max-width: var(--maxw);
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 14px;
  border-radius: 20px;
  background: linear-gradient(90deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.01));
  box-shadow: var(--shadow-1);
  backdrop-filter: blur(8px) saturate(120%);
  z-index: 60;
  border: 1px solid rgba(255, 255, 255, 0.03);
}

.logo-wrap {
  width: 104px;
  height: 104px;
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  background: rgba(255, 255, 255, 0.02);
  box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
  transition: transform .6s var(--ease), box-shadow .45s;
  border: 1px solid rgba(255, 255, 255, 0.04);
}

.logo-wrap:hover {
  transform: translateY(-8px) rotate(-3deg) scale(1.04);
  box-shadow: var(--accent);
}

.logo {
  width: 76px;
  height: auto;
  border-radius: 10px;
  display: block;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
}

.logo-overlay {
  position: absolute;
  inset: 0;
  border-radius: 14px;
  pointer-events: none;
  background:
    radial-gradient(60% 40% at 20% 20%, rgba(255, 255, 255, 0.08), transparent 60%),
    linear-gradient(120deg, rgba(251, 81, 128, 0.04), rgba(255, 127, 160, 0.02));
  mix-blend-mode: screen;
  filter: blur(10px);
  opacity: 0.6;
}

.header-title h1 {
  font-size: 1.45rem;
  color: var(--text);
  font-weight: 800;
}

.header-title p {
  margin-top: 6px;
  color: var(--muted);
  font-size: 0.92rem;
}

.header-title .sub {
  color: rgba(255, 255, 255, 0.15);
  font-size: 0.75rem;
  margin-top: 4px;
  letter-spacing: 1px;
}

/* Panel */
.panel {
  width: 100%;
  max-width: var(--maxw);
  background: rgba(18, 18, 22, 0.6);
  border-radius: 18px;
  padding: 18px;
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.03);
  transition: background .35s var(--ease), box-shadow .35s;
  backdrop-filter: blur(10px);
}

.panel-title {
  color: var(--muted);
  font-size: 0.85rem;
  font-weight: 300;
  padding: 8px 4px 16px 4px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.03);
  letter-spacing: 1px;
}

/* Menu Grid - 4 buttons */
.menu-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  padding-top: 16px;
}

.menu-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid rgba(255, 255, 255, 0.04);
  text-decoration: none;
  transition: all 0.4s var(--ease);
  cursor: pointer;
  position: relative;
  overflow: hidden;
  min-height: 80px;
}

.menu-card::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 14px;
  background: linear-gradient(135deg, rgba(251, 81, 128, 0.02), transparent);
  opacity: 0;
  transition: opacity 0.4s;
}

.menu-card:hover::before {
  opacity: 1;
}

.menu-card:hover {
  transform: translateY(-4px);
  border-color: rgba(255, 255, 255, 0.08);
  background: rgba(255, 255, 255, 0.04);
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
}

.menu-card:active {
  transform: translateY(0) scale(0.98);
}

/* Icon with SVG */
.menu-card .icon-wrap {
  width: 48px;
  height: 48px;
  min-width: 48px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.06);
  transition: all 0.3s ease;
  flex-shrink: 0;
}

.menu-card:hover .icon-wrap {
  transform: scale(1.05) rotate(-3deg);
  background: rgba(255, 255, 255, 0.06);
  border-color: rgba(255, 255, 255, 0.1);
}

.menu-card .icon-wrap svg {
  width: 24px;
  height: 24px;
  fill: none;
  stroke: rgba(255, 255, 255, 0.7);
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.menu-card:hover .icon-wrap svg {
  stroke: rgba(255, 255, 255, 0.9);
}

/* Different colors for each card */
.menu-card:nth-child(1) .icon-wrap {
  border-color: rgba(233, 30, 99, 0.3);
}
.menu-card:nth-child(1):hover .icon-wrap {
  border-color: rgba(233, 30, 99, 0.5);
  box-shadow: 0 0 30px rgba(233, 30, 99, 0.05);
}

.menu-card:nth-child(2) .icon-wrap {
  border-color: rgba(33, 150, 243, 0.3);
}
.menu-card:nth-child(2):hover .icon-wrap {
  border-color: rgba(33, 150, 243, 0.5);
  box-shadow: 0 0 30px rgba(33, 150, 243, 0.05);
}

.menu-card:nth-child(3) .icon-wrap {
  border-color: rgba(255, 152, 0, 0.3);
}
.menu-card:nth-child(3):hover .icon-wrap {
  border-color: rgba(255, 152, 0, 0.5);
  box-shadow: 0 0 30px rgba(255, 152, 0, 0.05);
}

.menu-card:nth-child(4) .icon-wrap {
  border-color: rgba(76, 175, 80, 0.3);
}
.menu-card:nth-child(4):hover .icon-wrap {
  border-color: rgba(76, 175, 80, 0.5);
  box-shadow: 0 0 30px rgba(76, 175, 80, 0.05);
}

.menu-card .info {
  flex: 1;
}

.menu-card .title {
  color: var(--text);
  font-size: 0.95rem;
  font-weight: 700;
  letter-spacing: -0.3px;
}

.menu-card .sub {
  color: var(--muted);
  font-size: 0.75rem;
  margin-top: 3px;
  opacity: 0.5;
  font-weight: 300;
}

.menu-card .arrow {
  color: rgba(255, 255, 255, 0.08);
  font-size: 1.2rem;
  transition: all 0.3s;
  opacity: 0;
  transform: translateX(-8px);
}

.menu-card:hover .arrow {
  opacity: 1;
  transform: translateX(0);
  color: rgba(255, 255, 255, 0.2);
}

/* Footer */
footer {
  width: 100%;
  max-width: var(--maxw);
  text-align: center;
  color: var(--muted);
  padding: 12px 0 30px;
  font-size: 0.85rem;
  opacity: 0.4;
}

/* Scrollbar */
::-webkit-scrollbar {
  width: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.06);
  border-radius: 100px;
}
::-webkit-scrollbar-thumb:hover {
  background: rgba(255, 255, 255, 0.12);
}

/* Responsive */
@media (max-width: 768px) {
  .menu-grid {
    grid-template-columns: 1fr;
  }

  .header-title h1 {
    font-size: 1.1rem;
  }

  .logo-wrap {
    width: 70px;
    height: 70px;
  }

  .logo {
    width: 50px;
  }

  .menu-card {
    min-height: 64px;
    padding: 14px;
  }

  .menu-card .icon-wrap {
    width: 40px;
    height: 40px;
    min-width: 40px;
  }

  .menu-card .icon-wrap svg {
    width: 20px;
    height: 20px;
  }

  .menu-card .title {
    font-size: 0.85rem;
  }
}

@media (max-width: 480px) {
  .header {
    gap: 10px;
    padding: 10px;
  }

  .logo-wrap {
    width: 56px;
    height: 56px;
  }

  .logo {
    width: 40px;
  }

  .header-title h1 {
    font-size: 0.95rem;
  }

  .header-title p {
    font-size: 0.75rem;
  }

  .menu-card {
    padding: 12px;
    min-height: 56px;
    gap: 10px;
  }

  .menu-card .icon-wrap {
    width: 36px;
    height: 36px;
    min-width: 36px;
    border-radius: 10px;
  }

  .menu-card .icon-wrap svg {
    width: 18px;
    height: 18px;
  }

  .menu-card .title {
    font-size: 0.8rem;
  }

  .menu-card .sub {
    font-size: 0.65rem;
  }
}
</style>
</head>
<body>

<!-- Header -->
<header class="header" role="banner">
  <div class="logo-wrap">
    <img class="logo" src="https://uploadkon.ir/uploads/7e2d29_25Quizly.png" alt="Quizly Logo" loading="lazy">
    <div class="logo-overlay" aria-hidden="true"></div>
  </div>

  <div class="header-title">
    <h1>Quizly — دروس ترم تابستان</h1>

</header>

<!-- Panel -->
<main class="panel">

    <!-- 3. مسائل و تنوع فرهنگی → C -->

      <div class="icon-wrap">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"/>
          <line x1="2" y1="12" x2="22" y2="12"/>

    <!-- 4. حفظ جزء سی → D -->
    <a href="./D/index.html" class="menu-card">

          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>

</main>

<footer>با 💗 Quizly — دروس ترم تابستان</footer>

</body>
</html>
