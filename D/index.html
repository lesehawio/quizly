{"n":96,"name":"علق","meaning":"علق / خون بسته","message":"آغاز وحی و دعوت به خواندن؛ علم و قلم در برابر طغیان.","key":"اقْرَأْ؛ آیات ۱ تا ۵ آغاز وحی مشهورند.","verses":"19","type":"مکی","firstWord":"اقْرَأْ","lastWord":"وَاقْتَرِبْ","lastVerse":"وَاسْجُدْ وَاقْتَرِب","versesOrder":["۱. اقْرَأْ بِاسْمِ رَبِّکَ الَّذِی خَلَقَ","۲. خَلَقَ الْإِنسَانَ مِنْ عَلَقٍ","۳. اقْرَأْ وَرَبُّکَ الْأَکْرَمُ","۴. الَّذِی عَلَّمَ بِالْقَلَمِ"],"before":"تین","after":"قدر","sharedWords":["—"],"uniqueWords":["اقْرَأْ","عَلَقٍ","النَّاصِیَةِ","الزَّبَانِیَةِ"],"repeatWords":"—","prophets":"—","sajdah":[19],
"ayahs":[
{"a":"اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَقَ","t":"بخوان به نام پروردگارت که آفرید."},
{"a":"خَلَقَ الْإِنسَانَ مِنْ عَلَقٍ","t":"انسان را از خون بسته آفرید."},
{"a":"اقْرَأْ وَرَبُّكَ الْأَكْرَمُ","t":"بخوان که پروردگارت کریم‌ترین است."},
{"a":"الَّذِي عَلَّمَ بِالْقَلَمِ","t":"همان‌کس که با قلم آموخت."},
{"a":"عَلَّمَ الْإِنسَانَ مَا لَمْ يَعْلَمْ","t":"به انسان آنچه نمی‌دانست آموخت."},
{"a":"كَلَّا إِنَّ الْإِنسَانَ لَيَطْغَىٰ","t":"چنین نیست! همانا انسان سرکشی می‌کند."},
{"a":"أَن رَّآهُ اسْتَغْنَىٰ","t":"از این‌که خود را بی‌نیاز می‌بیند."},
{"a":"إِنَّ إِلَىٰ رَبِّكَ الرُّجْعَىٰ","t":"همانا بازگشت به‌سوی پروردگار توست."},
{"a":"أَرَأَيْتَ الَّذِي يَنْهَىٰ","t":"آیا دیدی آن‌کس را که بازمی‌داشت؟"},
{"a":"عَبْدًا إِذَا صَلَّىٰ","t":"بنده‌ای را هنگامی که نماز می‌خواند؟"},
{"a":"أَرَأَيْتَ إِن كَانَ عَلَى الْهُدَىٰ","t":"آیا دیدی اگر او بر هدایت باشد؟"},
{"a":"أَوْ أَمَرَ بِالتَّقْوَىٰ","t":"یا به پرهیزگاری فرمان دهد؟"},
{"a":"أَرَأَيْتَ إِن كَذَّبَ وَتَوَلَّىٰ","t":"آیا دیدی اگر (او) تکذیب کند و روی گرداند؟"},
{"a":"أَلَمْ يَعْلَم بِأَنَّ اللَّهَ يَرَىٰ","t":"آیا نمی‌داند که خدا می‌بیند؟"},
{"a":"كَلَّا لَئِن لَّمْ يَنتَهِ لَنَسْفَعَنَّ بِالنَّاصِيَةِ","t":"چنین نیست! اگر بازنایستد، موی پیشانی‌اش را می‌کشیم."},
{"a":"نَاصِيَةٍ كَاذِبَةٍ خَاطِئَةٍ","t":"پیشانی‌ای دروغگو و خطاکار."},
{"a":"فَلْيَدْعُ نَادِيَهُ","t":"پس او (اهل) محفلش را بخواند."},
{"a":"سَنَدْعُ الزَّبَانِيَةَ","t":"ما هم نگهبانان (آتش) را می‌خوانیم."},
{"a":"كَلَّا لَا تُطِعْهُ وَاسْجُدْ وَاقْتَرِب","t":"چنین نیست! از او اطاعت مکن و سجده کن و (به خدا) نزدیک شو."}
]},

{"n":97,"name":"قدر","meaning":"اندازه / تقدیر","message":"عظمت شب قدر و نزول قرآن و برتری آن بر هزار ماه.","key":"لَیْلَةُ الْقَدْرِ خَیْرٌ مِنْ أَلْفِ شَهْرٍ","verses":"5","type":"مکی","firstWord":"إِنَّا","lastWord":"الْفَجْرِ","lastVerse":"سَلَامٌ هِیَ حَتَّى مَطْلَعِ الْفَجْرِ","versesOrder":["۱. إِنَّا أَنزَلْنَاهُ فِی لَیْلَةِ الْقَدْرِ","۲. وَمَا أَدْرَاکَ مَا لَیْلَةُ الْقَدْرِ","۳. لَیْلَةُ الْقَدْرِ خَیْرٌ مِّنْ أَلْفِ شَهْرٍ","۴. تَنَزَّلُ الْمَلَائِکَةُ وَالرُّوحُ فِیهَا بِإِذْنِ رَبِّهِم"],"before":"علق","after":"بینه","sharedWords":["—"],"uniqueWords":["الْقَدْرِ","أَلْفِ شَهْرٍ"],"repeatWords":"—","prophets":"—",
"ayahs":[
{"a":"إِنَّا أَنزَلْنَاهُ فِي لَيْلَةِ الْقَدْرِ","t":"ما آن (قرآن) را در شب قدر نازل کردیم."},
{"a":"وَمَا أَدْرَاكَ مَا لَيْلَةُ الْقَدْرِ","t":"و تو چه می‌دانی شب قدر چیست؟"},
{"a":"لَيْلَةُ الْقَدْرِ خَيْرٌ مِّنْ أَلْفِ شَهْرٍ","t":"شب قدر از هزار ماه بهتر است."},
{"a":"تَنَزَّلُ الْمَلَائِكَةُ وَالرُّوحُ فِيهَا بِإِذْنِ رَبِّهِم مِّن كُلِّ أَمْرٍ","t":"فرشتگان و روح در آن شب به‌اذن پروردگارشان برای هر کاری نازل می‌شوند."},
{"a":"سَلَامٌ هِيَ حَتَّىٰ مَطْلَعِ الْفَجْرِ","t":"آن شب تا طلوع فجر سلام است."}
]},

{"n":98,"name":"بینه","meaning":"دلیل روشن","message":"پیامبر و قرآن به‌عنوان بینه و تقسیم انسان‌ها به خیرالبریه و شرالبریه.","key":"خَیْرُ الْبَرِیَّة / شَرُّ الْبَرِیَّة","verses":"8","type":"مدنی","firstWord":"لَمْ","lastWord":"رَبَّهُ","lastVerse":"ذَلِکَ لِمَنْ خَشِیَ رَبَّهُ","versesOrder":["۱. لَمْ یَکُنِ الَّذِینَ کَفَرُوا","۲. رَسُولٌ مِّنَ اللَّهِ یَتْلُو صُحُفًا مُّطَهَّرَةً","۳. فِیهَا کُتُبٌ قَیِّمَةٌ","۴. وَمَا تَفَرَّقَ الَّذِینَ أُوتُوا الْکِتَابَ"],"before":"قدر","after":"زلزله","sharedWords":["—"],"uniqueWords":["الْبَرِیَّة","مُّطَهَّرَةً","رَضِيَ اللَّهُ"],"repeatWords":"—","prophets":"—",
"ayahs":[
{"a":"لَمْ يَكُنِ الَّذِينَ كَفَرُوا مِنْ أَهْلِ الْكِتَابِ وَالْمُشْرِكِينَ مُنفَكِّينَ حَتَّىٰ تَأْتِيَهُمُ الْبَيِّنَةُ","t":"کافران از اهل کتاب و مشرکان (از کفر خود) دست برنداشتند تا آنکه برایشان دلیلی روشن آمد."},
{"a":"رَسُولٌ مِّنَ اللَّهِ يَتْلُو صُحُفًا مُّطَهَّرَةً","t":"فرستاده‌ای از جانب خدا که صفحاتی پاک را می‌خواند."},
{"a":"فِيهَا كُتُبٌ قَيِّمَةٌ","t":"در آن، نوشته‌های استوار است."},
{"a":"وَمَا تَفَرَّقَ الَّذِينَ أُوتُوا الْكِتَابَ إِلَّا مِن بَعْدِ مَا جَاءَتْهُمُ الْبَيِّنَةُ","t":"اهل کتاب پراکنده نشدند مگر پس از آنکه دلیل روشن برایشان آمد."},
{"a":"وَمَا أُمِرُوا إِلَّا لِيَعْبُدُوا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ حُنَفَاءَ وَيُقِيمُوا الصَّلَاةَ وَيُؤْتُوا الزَّكَاةَ ۚ وَذَٰلِكَ دِينُ الْقَيِّمَةِ","t":"و به آن‌ها دستوری داده نشد مگر اینکه خدا را بپرستند درحالی‌که دین خود را برای او خالص کرده و یکتاپرست باشند و نماز برپا دارند و زکات بدهند؛ این است دین استوار."},
{"a":"إِنَّ الَّذِينَ كَفَرُوا مِنْ أَهْلِ الْكِتَابِ وَالْمُشْرِكِينَ فِي نَارِ جَهَنَّمَ خَالِدِينَ فِيهَا ۚ أُولَٰئِكَ هُمْ شَرُّ الْبَرِيَّةِ","t":"همانا کافران از اهل کتاب و مشرکان در آتش جهنم جاودانه‌اند؛ آنان بدترین آفریدگانند."},
{"a":"إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ أُولَٰئِكَ هُمْ خَيْرُ الْبَرِيَّةِ","t":"همانا کسانی که ایمان آورده و کارهای شایسته کرده‌اند، آنان بهترین آفریدگانند."},
{"a":"جَزَاؤُهُمْ عِندَ رَبِّهِمْ جَنَّاتُ عَدْنٍ تَجْرِي مِن تَحْتِهَا الْأَنْهَارُ خَالِدِينَ فِيهَا أَبَدًا ۖ رَّضِيَ اللَّهُ عَنْهُمْ وَرَضُوا عَنْهُ ۚ ذَٰلِكَ لِمَنْ خَشِيَ رَبَّهُ","t":"پاداش آن‌ها نزد پروردگارشان باغ‌های جاودان است که نهرها زیرشان جاری است، جاودانه در آن می‌مانند؛ خدا از آنان خشنود و آنان از خدا خشنودند؛ این برای کسی است که از پروردگارش بترسد."}
]},

{"n":99,"name":"زلزله","meaning":"زلزله","message":"در قیامت زمین دگرگون و همه اعمال حتی به اندازه ذره آشکار می‌شود.","key":"مِثْقَالَ ذَرَّة؛ هیچ عمل کوچکی بی‌حساب نیست.","verses":"8","type":"مدنی","firstWord":"إِذَا","lastWord":"یَرَهُ","lastVerse":"وَمَن یَعْمَلْ مِثْقَالَ ذَرَّةٍ شَرًّا یَرَهُ","versesOrder":["۱. إِذَا زُلْزِلَتِ الْأَرْضُ زِلْزَالَهَا","۲. وَأَخْرَجَتِ الْأَرْضُ أَثْقَالَهَا","۳. وَقَالَ الْإِنسَانُ مَا لَهَا","۴. یَوْمَئِذٍ تُحَدِّثُ أَخْبَارَهَا"],"before":"بینه","after":"عادیات","sharedWords":["—"],"uniqueWords":["زُلْزِلَتِ","أَثْقَالَهَا","مِثْقَالَ ذَرَّةٍ"],"repeatWords":"—","prophets":"—",
"ayahs":[
{"a":"إِذَا زُلْزِلَتِ الْأَرْضُ زِلْزَالَهَا","t":"وقتی زمین به‌سختی بلرزد."},
{"a":"وَأَخْرَجَتِ الْأَرْضُ أَثْقَالَهَا","t":"و زمین بارهای سنگینش را بیرون اندازد."},
{"a":"وَقَالَ الْإِنسَانُ مَا لَهَا","t":"و انسان بگوید: او را چه شده است؟"},
{"a":"يَوْمَئِذٍ تُحَدِّثُ أَخْبَارَهَا","t":"در آن روز زمین اخبار خود را بازگو می‌کند."},
{"a":"بِأَنَّ رَبَّكَ أَوْحَىٰ لَهَا","t":"زیرا پروردگارت به او وحی کرده است."},
{"a":"يَوْمَئِذٍ يَصْدُرُ النَّاسُ أَشْتَاتًا لِّيُرَوْا أَعْمَالَهُمْ","t":"در آن روز مردم پراکنده بازمی‌گردند تا اعمالشان به آنان نشان داده شود."},
{"a":"فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُ","t":"پس هر که به‌اندازه ذره‌ای کار نیک کند، آن را می‌بیند."},
{"a":"وَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ شَرًّا يَرَهُ","t":"و هر که به‌اندازه ذره‌ای کار بد کند، آن را می‌بیند."}
]},

{"n":100,"name":"عادیات","meaning":"دوندگان","message":"تصویر اسب‌های تیزرو و سپس نکوهش ناسپاسی و دلبستگی شدید به مال.","key":"إِنَّ الْإِنسَانَ لِرَبِّهِ لَکَنُودٌ","verses":"11","type":"مکی","firstWord":"وَالْعَادِیَاتِ","lastWord":"لَخَبِیرٌ","lastVerse":"إِنَّ رَبَّهُم بِهِمْ یَوْمَئِذٍ لَّخَبِیرٌ","versesOrder":["۱. وَالْعَادِیَاتِ ضَبْحًا","۲. فَالْمُورِیَاتِ قَدْحًا","۳. فَالْمُغِیرَاتِ صُبْحًا","۴. فَأَثَرْنَ بِهِ نَقْعًا"],"before":"زلزله","after":"قارعه","sharedWords":["خُنَّع (با طارق)"],"uniqueWords":["وَالْعَادِیَاتِ","ضَبْحًا","لَکَنُودٌ"],"repeatWords":"—","prophets":"—",
"ayahs":[
{"a":"وَالْعَادِيَاتِ ضَبْحًا","t":"سوگند به اسبان تیزپا که (با نفس‌زنان) می‌دوند."},
{"a":"فَالْمُورِيَاتِ قَدْحًا","t":"و سوگند به آنان که (از سم) آتش می‌جهانند."},
{"a":"فَالْمُغِيرَاتِ صُبْحًا","t":"و سوگند به آنان که هنگام صبح هجوم می‌آورند."},
{"a":"فَأَثَرْنَ بِهِ نَقْعًا","t":"و در آن (زمان) گرد و غبار برانگیختند."},
{"a":"فَوَسَطْنَ بِهِ جَمْعًا","t":"و در میان دشمنان وارد شدند."},
{"a":"إِنَّ الْإِنسَانَ لِرَبِّهِ لَكَنُودٌ","t":"همانا انسان نسبت به پروردگارش ناسپاس است."},
{"a":"وَإِنَّهُ عَلَىٰ ذَٰلِكَ لَشَهِيدٌ","t":"و او خود بر این (ناسپاسی) گواه است."},
{"a":"وَإِنَّهُ لِحُبِّ الْخَيْرِ لَشَدِيدٌ","t":"و او علاقه شدیدی به مال دارد."},
{"a":"أَفَلَا يَعْلَمُ إِذَا بُعْثِرَ مَا فِي الْقُبُورِ","t":"آیا نمی‌داند که وقتی آنچه در قبرهاست بیرون ریخته شود؟"},
{"a":"وَحُصِّلَ مَا فِي الصُّدُورِ","t":"و آنچه در سینه‌هاست آشکار گردد."},
{"a":"إِنَّ رَبَّهُم بِهِمْ يَوْمَئِذٍ لَّخَبِيرٌ","t":"همانا پروردگارشان در آن روز به آنان آگاه است."}
]},

{"n":101,"name":"قارعه","meaning":"کوبنده","message":"هول قیامت و سنجش اعمال در میزان الهی.","key":"سنگینی میزان=خوشی؛ سبکی میزان=هاویه.","verses":"11","type":"مکی","firstWord":"الْقَارِعَةُ","lastWord":"هَاوِيَهْ","lastVerse":"فَأُمُّهُ هَاوِيَةٌ","versesOrder":["۱. الْقَارِعَةُ","۲. مَا الْقَارِعَةُ","۳. وَمَا أَدْرَاکَ مَا الْقَارِعَةُ","۴. یَوْمَ یَکُونُ النَّاسُ کَالْفَرَاشِ الْمَبْثُوثِ"],"before":"عادیات","after":"تکاثر","sharedWords":["خَاشِعَةٌ (با غاشیه، نازعات)"],"uniqueWords":["الْقَارِعَةُ","هَاوِيَةٌ","الْمَبْثُوثِ"],"repeatWords":"—","prophets":"—",
"ayahs":[
{"a":"الْقَارِعَةُ","t":"(آن حادثه) کوبنده."},
{"a":"مَا الْقَارِعَةُ","t":"چیست آن کوبنده؟"},
{"a":"وَمَا أَدْرَاكَ مَا الْقَارِعَةُ","t":"و تو چه می‌دانی آن کوبنده چیست؟"},
{"a":"يَوْمَ يَكُونُ النَّاسُ كَالْفَرَاشِ الْمَبْثُوثِ","t":"روزی که مردم چون پروانه‌های پراکنده شوند."},
{"a":"وَتَكُونُ الْجِبَالُ كَالْعِهْنِ الْمَنفُوشِ","t":"و کوه‌ها چون پشم زده‌شده گردند."},
{"a":"فَأَمَّا مَن ثَقُلَتْ مَوَازِينُهُ","t":"پس هر که کفه (اعمال نیک) او سنگین باشد."},
{"a":"فَهُوَ فِي عِيشَةٍ رَّاضِيَةٍ","t":"در زندگی خشنودی خواهد بود."},
{"a":"وَأَمَّا مَنْ خَفَّتْ مَوَازِينُهُ","t":"و اما هر که کفه (اعمال نیک) او سبک باشد."},
{"a":"فَأُمُّهُ هَاوِيَةٌ","t":"پناهگاهش هاویه (دوزخ) است."},
{"a":"وَمَا أَدْرَاكَ مَا هِيَهْ","t":"و تو چه می‌دانی آن چیست؟"},
{"a":"نَارٌ حَامِيَةٌ","t":"آتشی است سوزان."}
]},

{"n":102,"name":"تکاثر","meaning":"فزون‌طلبی","message":"رقابت در زیاد کردن مال و امکانات انسان را از حقیقت غافل می‌کند.","key":"أَلْهَاکُمُ التَّکَاثُرُ","verses":"8","type":"مکی","firstWord":"أَلْهَاکُمُ","lastWord":"النَّعِیمِ","lastVerse":"ثُمَّ لَتُسْأَلُنَّ یَوْمَئِذٍ عَنِ النَّعِیمِ","versesOrder":["۱. أَلْهَاکُمُ التَّکَاثُرُ","۲. حَتَّى زُرْتُمُ الْمَقَابِرَ","۳. کَلَّا سَوْفَ تَعْلَمُونَ","۴. ثُمَّ کَلَّا سَوْفَ تَعْلَمُونَ"],"before":"قارعه","after":"عصر","sharedWords":["الْجَحِیمِ (با نازعات، عبس، تکویر)"],"uniqueWords":["أَلْهَاکُمُ","التَّکَاثُرُ"],"repeatWords":"—","prophets":"—",
"ayahs":[
{"a":"أَلْهَاكُمُ التَّكَاثُرُ","t":"فزون‌طلبی شما را غافل کرد."},
{"a":"حَتَّىٰ زُرْتُمُ الْمَقَابِرَ","t":"تا آنکه به قبرها وارد شدید."},
{"a":"كَلَّا سَوْفَ تَعْلَمُونَ","t":"چنین نیست! به‌زودی خواهید دانست."},
{"a":"ثُمَّ كَلَّا سَوْفَ تَعْلَمُونَ","t":"باز هم چنین نیست! به‌زودی خواهید دانست."},
{"a":"كَلَّا لَوْ تَعْلَمُونَ عِلْمَ الْيَقِينِ","t":"چنین نیست! اگر علم یقین داشتید."},
{"a":"لَتَرَوُنَّ الْجَحِيمَ","t":"قطعاً جهنم را خواهید دید."},
{"a":"ثُمَّ لَتَرَوُنَّهَا عَيْنَ الْيَقِينِ","t":"سپس آن را به دیده یقین خواهید دید."},
{"a":"ثُمَّ لَتُسْأَلُنَّ يَوْمَئِذٍ عَنِ النَّعِيمِ","t":"سپس در آن روز از نعمت‌ها بازخواست می‌شوید."}
]},

{"n":103,"name":"عصر","meaning":"زمان","message":"تنها راه نجات: ایمان، عمل صالح، سفارش به حق و سفارش به صبر.","key":"ایمان + عمل صالح + حق + صبر","verses":"3","type":"مکی","firstWord":"وَالْعَصْرِ","lastWord":"بِالصَّبْرِ","lastVerse":"وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ","versesOrder":["۱. وَالْعَصْرِ","۲. إِنَّ الْإِنسَانَ لَفِی خُسْرٍ","۳. إِلَّا الَّذِینَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ"],"before":"تکاثر","after":"همزه","sharedWords":["—"],"uniqueWords":["وَالْعَصْرِ","خُسْرٍ","بِالصَّبْرِ"],"repeatWords":"—","prophets":"—",
"ayahs":[
{"a":"وَالْعَصْرِ","t":"سوگند به زمان."},
{"a":"إِنَّ الْإِنسَانَ لَفِي خُسْرٍ","t":"همانا انسان در زیان است."},
{"a":"إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ","t":"مگر کسانی که ایمان آورده و کارهای شایسته کردند و یکدیگر را به حق و صبر سفارش کردند."}
]},

{"n":104,"name":"همزه","meaning":"عیب‌جو","message":"نکوهش عیب‌جویی و تحقیر و جمع مال با خیال جاودانگی.","key":"الْحُطَمَة نام آتش جهنم در سوره است.","verses":"9","type":"مکی","firstWord":"وَیْلٌ","lastWord":"مُّؤْصَدَةٌ","lastVerse":"إِنَّهَا عَلَیْهِم مُّؤْصَدَةٌ","versesOrder":["۱. وَیْلٌ لِّکُلِّ هُمَزَةٍ لُّمَزَةٍ","۲. الَّذِی جَمَعَ مَالًا وَعَدَّدَهُ","۳. یَحْسَبُ أَنَّ مَالَهُ أَخْلَدَهُ","۴. کَلَّا لَیُنبَذَنَّ فِی الْحُطَمَةِ"],"before":"عصر","after":"فیل","sharedWords":["—"],"uniqueWords":["هُمَزَةٍ","لُّمَزَةٍ","الْحُطَمَةِ","مُّؤْصَدَةٌ"],"repeatWords":"—","prophets":"—",
"ayahs":[
{"a":"وَيْلٌ لِّكُلِّ هُمَزَةٍ لُّمَزَةٍ","t":"وای بر هر عیب‌جوی طعنه‌زن!"},
{"a":"الَّذِي جَمَعَ مَالًا وَعَدَّدَهُ","t":"همان‌کس که مالی جمع کرد و آن را شمرد."},
{"a":"يَحْسَبُ أَنَّ مَالَهُ أَخْلَدَهُ","t":"گمان می‌کند که مالش او را جاودان می‌کند."},
{"a":"كَلَّا ۖ لَيُنبَذَنَّ فِي الْحُطَمَةِ","t":"چنین نیست! قطعاً در حطمه (آتش خردکننده) انداخته می‌شود."},
{"a":"وَمَا أَدْرَاكَ مَا الْحُطَمَةُ","t":"و تو چه می‌دانی حطمه چیست؟"},
{"a":"نَارُ اللَّهِ الْمُوقَدَةُ","t":"آتش برافروخته خدا."},
{"a":"الَّتِي تَطَّلِعُ عَلَى الْأَفْئِدَةِ","t":"آتشی که بر دل‌ها راه می‌یابد."},
{"a":"إِنَّهَا عَلَيْهِم مُّؤْصَدَةٌ","t":"همانا آن (آتش) بر آنان بسته است."},
{"a":"فِي عَمَدٍ مُّمَدَّدَةٍ","t":"در ستون‌های کشیده‌شده."}
]},

{"n":105,"name":"فیل","meaning":"فیل","message":"یادآوری نابودی سپاه فیل و حفاظت خدا از کعبه.","key":"أَصْحَابُ الْفِیل / طَیْرًا أَبَابِیل","verses":"5","type":"مکی","firstWord":"أَلَمْ","lastWord":"مَّأْكُولٍ","lastVerse":"فَجَعَلَهُمْ كَعَصْفٍ مَّأْكُولٍ","versesOrder":["۱. أَلَمْ تَرَ کَیْفَ فَعَلَ رَبُّکَ بِأَصْحَابِ الْفِیلِ","۲. أَلَمْ یَجْعَلْ کَیْدَهُمْ فِی تَضْلِیلٍ","۳. وَأَرْسَلَ عَلَیْهِمْ طَیْرًا أَبَابِیلَ","۴. تَرْمِیهِم بِحِجَارَةٍ مِّن سِجِّیلٍ"],"before":"همزه","after":"قریش","sharedWords":["—"],"uniqueWords":["الْفِیلِ","أَبَابِیلَ","سِجِّیلٍ"],"repeatWords":"—","prophets":"—",
"ayahs":[
{"a":"أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَابِ الْفِيلِ","t":"آیا ندیدی پروردگارت با اصحاب فیل چه کرد؟"},
{"a":"أَلَمْ يَجْعَلْ كَيْدَهُمْ فِي تَضْلِيلٍ","t":"آیا نقشه‌شان را در تباهی قرار نداد؟"},
{"a":"وَأَرْسَلَ عَلَيْهِمْ طَيْرًا أَبَابِيلَ","t":"و بر آن‌ها پرندگانی دسته‌دسته فرستاد."},
{"a":"تَرْمِيهِم بِحِجَارَةٍ مِّن سِجِّيلٍ","t":"که آن‌ها را با سنگ‌هایی از گل سنگ می‌زدند."},
{"a":"فَجَعَلَهُمْ كَعَصْفٍ مَّأْكُولٍ","t":"و آن‌ها را چون کاه خورده‌شده قرار داد."}
]},

,

{"n":106,"name":"قریش","meaning":"قریش","message":"یادآوری امنیت و روزی قریش و دعوت آنان به عبادت پروردگار کعبه.","key":"نعمت امنیت و رزق باید به عبادت خدا منجر شود.","verses":"4","type":"مکی","firstWord":"لِإِیلَافِ","lastWord":"خَوْفٍ","lastVerse":"الَّذِی أَطْعَمَهُم مِّن جُوعٍ وَآمَنَهُم مِّنْ خَوْفٍ","versesOrder":["۱. لِإِیلَافِ قُرَیْشٍ","۲. إِیلَافِهِمْ رِحْلَةَ الشِّتَاءِ وَالصَّیْفِ","۳. فَلْیَعْبُدُوا رَبَّ هَذَا الْبَیْتِ","۴. الَّذِی أَطْعَمَهُم مِّن جُوعٍ وَآمَنَهُم مِّنْ خَوْفٍ"],"before":"فیل","after":"ماعون","sharedWords":["—"],"uniqueWords":["لِإِیلَافِ","قُرَیْشٍ","الشِّتَاءِ"],"repeatWords":"—","prophets":"—",
"ayahs":[
{"a":"لِإِيلَافِ قُرَيْشٍ","t":"برای انس و الفت قریش."},
{"a":"إِيلَافِهِمْ رِحْلَةَ الشِّتَاءِ وَالصَّيْفِ","t":"الفت‌شان در سفر زمستان و تابستان."},
{"a":"فَلْيَعْبُدُوا رَبَّ هَٰذَا الْبَيْتِ","t":"پس باید پروردگار این خانه (کعبه) را بپرستند."},
{"a":"الَّذِي أَطْعَمَهُم مِّن جُوعٍ وَآمَنَهُم مِّنْ خَوْفٍ","t":"همان‌کس که آنان را از گرسنگی غذا داد و از ترس ایمن ساخت."}
]},

{"n":107,"name":"ماعون","meaning":"کمک کوچک","message":"نشانه‌های تکذیب دین: بی‌توجهی به یتیم و مسکین و عبادت ریاکارانه.","key":"الماعون=کمک‌ها و وسایل مورد نیاز مردم.","verses":"7","type":"مکی","firstWord":"أَرَأَیْتَ","lastWord":"الْمَاعُونَ","lastVerse":"وَيَمْنَعُونَ الْمَاعُونَ","versesOrder":["۱. أَرَأَیْتَ الَّذِی یُکَذِّبُ بِالدِّینِ","۲. فَذَلِکَ الَّذِی یَدُعُّ الْیَتِیمَ","۳. وَلَا یَحُضُّ عَلَى طَعَامِ الْمِسْکِینِ","۴. فَوَیْلٌ لِّلْمُصَلِّینَ"],"before":"قریش","after":"کوثر","sharedWords":["الَّذِینَ (دو بار در همین سوره)"],"uniqueWords":["الْمَاعُونَ","یَدُعُّ","سَاهُونَ"],"repeatWords":"الَّذِينَ ۲ بار","prophets":"—",
"ayahs":[
{"a":"أَرَأَيْتَ الَّذِي يُكَذِّبُ بِالدِّينِ","t":"آیا دیدی آن‌کس را که روز جزا را تکذیب می‌کند؟"},
{"a":"فَذَٰلِكَ الَّذِي يَدُعُّ الْيَتِيمَ","t":"او همان‌کس است که یتیم را به‌سختی می‌راند."},
{"a":"وَلَا يَحُضُّ عَلَىٰ طَعَامِ الْمِسْكِينِ","t":"و (دیگران را) به اطعام مسکین تشویق نمی‌کند."},
{"a":"فَوَيْلٌ لِّلْمُصَلِّينَ","t":"پس وای بر نمازگزاران!"},
{"a":"الَّذِينَ هُمْ عَن صَلَاتِهِمْ سَاهُونَ","t":"آنان که از نمازشان غافلند."},
{"a":"الَّذِينَ هُمْ يُرَاءُونَ","t":"همان‌کسانی که ریا می‌کنند."},
{"a":"وَيَمْنَعُونَ الْمَاعُونَ","t":"و از کمک (به نیازمندان) خودداری می‌کنند."}
]},

{"n":108,"name":"کوثر","meaning":"خیر فراوان","message":"اعطای خیر فراوان به پیامبر و فرمان نماز و قربانی و وعده شکست دشمن.","key":"إِنَّا أَعْطَیْنَاکَ الْکَوْثَرَ","verses":"3","type":"مکی","firstWord":"إِنَّا","lastWord":"الْأَبْتَرُ","lastVerse":"إِنَّ شَانِئَکَ هُوَ الْأَبْتَرُ","versesOrder":["۱. إِنَّا أَعْطَیْنَاکَ الْکَوْثَرَ","۲. فَصَلِّ لِرَبِّکَ وَانْحَرْ","۳. إِنَّ شَانِئَکَ هُوَ الْأَبْتَرُ"],"before":"ماعون","after":"کافرون","sharedWords":["—"],"uniqueWords":["الْکَوْثَرَ","وَانْحَرْ","الْأَبْتَرُ"],"repeatWords":"—","prophets":"—",
"ayahs":[
{"a":"إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ","t":"همانا ما به تو کوثر (خیر فراوان) عطا کردیم."},
{"a":"فَصَلِّ لِرَبِّكَ وَانْحَرْ","t":"پس برای پروردگارت نماز بخوان و قربانی کن."},
{"a":"إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ","t":"همانا دشمن تو خودش بریده (بی‌نسل) است."}
]},

{"n":109,"name":"کافرون","meaning":"کافران","message":"مرزبندی روشن میان توحید و شرک و نفی سازش اعتقادی.","key":"لَکُمْ دِینُکُمْ وَلِیَ دِینِ","verses":"6","type":"مکی","firstWord":"قُلْ","lastWord":"دِینِ","lastVerse":"لَکُمْ دِینُکُمْ وَلِیَ دِینِ","versesOrder":["۱. قُلْ یَا أَیُّهَا الْکَافِرُونَ","۲. لَا أَعْبُدُ مَا تَعْبُدُونَ","۳. وَلَا أَنتُمْ عَابِدُونَ مَا أَعْبُدُ","۴. وَلَا أَنَا عَابِدٌ مَّا عَبَدْتُمْ"],"before":"کوثر","after":"نصر","sharedWords":["—"],"uniqueWords":["الْکَافِرُونَ","عَابِدُونَ","دِینِ"],"repeatWords":"—","prophets":"—",
"ayahs":[
{"a":"قُلْ يَا أَيُّهَا الْكَافِرُونَ","t":"بگو: ای کافران!"},
{"a":"لَا أَعْبُدُ مَا تَعْبُدُونَ","t":"من آنچه شما می‌پرستید، نمی‌پرستم."},
{"a":"وَلَا أَنتُمْ عَابِدُونَ مَا أَعْبُدُ","t":"و شما هم آنچه من می‌پرستم، نمی‌پرستید."},
{"a":"وَلَا أَنَا عَابِدٌ مَّا عَبَدتُّمْ","t":"و من پرستنده آنچه شما پرستیدید، نیستم."},
{"a":"وَلَا أَنتُمْ عَابِدُونَ مَا أَعْبُدُ","t":"و شما هم پرستنده آنچه من می‌پرستم، نیستید."},
{"a":"لَكُمْ دِينُكُمْ وَلِيَ دِينِ","t":"دین شما برای خودتان و دین من برای خودم."}
]},

{"n":110,"name":"نصر","meaning":"یاری","message":"خبر از یاری خدا و فتح و فرمان تسبیح و استغفار پس از پیروزی.","key":"پس از پیروزی: تسبیح، حمد و استغفار.","verses":"3","type":"مدنی","firstWord":"إِذَا","lastWord":"تَوَّابًا","lastVerse":"إِنَّهُ کَانَ تَوَّابًا","versesOrder":["۱. إِذَا جَاءَ نَصْرُ اللَّهِ وَالْفَتْحُ","۲. وَرَأَیْتَ النَّاسَ یَدْخُلُونَ فِی دِینِ اللَّهِ أَفْوَاجًا","۳. فَسَبِّحْ بِحَمْدِ رَبِّکَ وَاسْتَغْفِرْهُ"],"before":"کافرون","after":"مسد","sharedWords":["—"],"uniqueWords":["نَصْرُ","أَفْوَاجًا","تَوَّابًا"],"repeatWords":"—","prophets":"—",
"ayahs":[
{"a":"إِذَا جَاءَ نَصْرُ اللَّهِ وَالْفَتْحُ","t":"وقتی یاری خدا و فتح (مکه) فرا رسد."},
{"a":"وَرَأَيْتَ النَّاسَ يَدْخُلُونَ فِي دِينِ اللَّهِ أَفْوَاجًا","t":"و مردم را ببینی که فوج‌فوج در دین خدا وارد می‌شوند."},
{"a":"فَسَبِّحْ بِحَمْدِ رَبِّكَ وَاسْتَغْفِرْهُ ۚ إِنَّهُ كَانَ تَوَّابًا","t":"پس پروردگارت را تسبیح و حمد کن و از او آمرزش بخواه؛ همانا او توبه‌پذیر است."}
]},

{"n":111,"name":"مسد","meaning":"ریسمان لیف خرما","message":"نکوهش ابولهب و همسرش و بی‌اثر بودن مال و جایگاه در برابر حق.","key":"تَبَّتْ یَدَا أَبِی لَهَبٍ","verses":"5","type":"مکی","firstWord":"تَبَّتْ","lastWord":"مَسَدٍ","lastVerse":"فِی جِیدِهَا حَبْلٌ مِّن مَّسَدٍ","versesOrder":["۱. تَبَّتْ یَدَا أَبِی لَهَبٍ وَتَبَّ","۲. مَا أَغْنَى عَنْهُ مَالُهُ وَمَا کَسَبَ","۳. سَیَصْلَى نَارًا ذَاتَ لَهَبٍ","۴. وَامْرَأَتُهُ حَمَّالَةَ الْحَطَبِ"],"before":"نصر","after":"اخلاص","sharedWords":["لَهَبٍ"],"uniqueWords":["تَبَّتْ","أَبِی لَهَبٍ","مَسَدٍ"],"repeatWords":"—","prophets":"—",

/* ============================================================
   CARD
   ============================================================ */
function card(s,i){
  const vo = s.versesOrder || [];
  const sw = s.sharedWords || [];
  const uw = s.uniqueWords || [];
  const fullMode = mode === "full";
  const quickMode = mode === "quick";
  const versesMode = mode === "verses";

  if(versesMode) return versesCard(s,i);

  return `
  <article class="card ${quickMode ? "quick-mode" : ""}">
    <div class="inside">
      <div class="no"><span class="dot"></span>سوره ${fa(i+1)} از ${fa(D.length)}</div>
      <div class="title"><h2>${s.name}</h2><span class="pill">${s.type}</span></div>
      <div class="meaning">معنی نام: ${s.meaning} · ${fa(s.verses)} آیه</div>

      <div class="msg">
        <div class="label">${icons.message}<span>پیام اصلی سوره</span></div>
        <p>${s.message}</p>
      </div>

      <div class="cols">
        <div class="box">
          <h3>${icons.info}<span>مشخصات سریع</span></h3>
          <p>شماره سوره: ${fa(s.n)}</p>
          <p>تعداد آیات: ${fa(s.verses)}</p>
          <p>نوع: ${s.type}</p>
          <p>اولین کلمه: ${s.firstWord}</p>
          <p>آخرین کلمه: ${s.lastWord}</p>
        </div>
        <div class="box">
          <h3>${icons.list}<span>موقعیت در مصحف</span></h3>
          <p>سورهٔ قبل: ${s.before}</p>
          <p>سورهٔ بعد: ${s.after}</p>
          ${s.prophets && s.prophets !== "—" ? `<p>پیامبران: ${s.prophets}</p>` : ""}
        </div>
      </div>

      ${fullMode && vo.length ? `
      <div class="verse-box">
        <h3>${icons.book}<span>آیات ابتدایی (۱ تا ۴)</span></h3>
        ${vo.map(v => `<div class="v">${v}</div>`).join("")}
      </div>` : ""}

      ${fullMode ? `
      <div class="verse-box" style="border-right-color:var(--pink)">
        <h3 style="color:var(--pink)">${icons.key}<span>آخرین آیهٔ سوره</span></h3>
        <div class="v">${s.lastVerse}</div>
      </div>` : ""}

      ${fullMode && sw.length && sw[0] !== "—" ? `
      <div class="verse-box" style="border-right-color:var(--green)">
        <h3 style="color:var(--green)">${icons.list}<span>کلمات مشترک با سوره‌های دیگر</span></h3>
        ${sw.map(v => `<div class="v">• ${v}</div>`).join("")}
      </div>` : ""}

      ${fullMode && uw.length ? `
      <div class="verse-box" style="border-right-color:var(--gold)">
        <h3 style="color:var(--gold)">${icons.spark}<span>کلمات منحصربه‌فرد سوره</span></h3>
        <div class="v">${uw.join(" · ")}</div>
      </div>` : ""}

      ${fullMode && s.repeatWords && s.repeatWords !== "—" ? `
      <div class="test-box">
        <h3>${icons.help}<span>کلمات پرتکرار</span></h3>
        <div class="q">${s.repeatWords}</div>
      </div>` : ""}

      <div class="key">
        <b>${icons.key}<span>کلیدواژهٔ امتحانی</span></b>
        <div>${s.key}</div>
      </div>
    </div>
  </article>`;
}

/* ============================================================
   VERSES MODE
   ============================================================ */
function versesCard(s,i){
  const ayahs = s.ayahs || [];
  const sajdahList = s.sajdah || [];

  const body = ayahs.length ? `
    <div class="ayah-list">
      ${ayahs.map((ayah, idx) => {
        const num = idx + 1;
        const isSajdah = sajdahList.includes(num);
        return `
          <div class="ayah-item ${isSajdah ? "sajdah" : ""}">
            <div class="ayah-no">${fa(num)}</div>
            ${isSajdah ? `<span class="sajdah-badge">آیهٔ سجده</span>` : ""}
            <div class="arabic">${ayah.a}</div>
            <div class="translation">${ayah.t}</div>
          </div>
        `;
      }).join("")}
    </div>
  ` : `<div class="error-msg"><strong>متن آیات موجود نیست</strong>لطفاً بعداً تلاش کنید.</div>`;

  return `
  <article class="card verses-mode">
    <div class="inside">
      <div class="no"><span class="dot"></span>سوره ${fa(i+1)} از ${fa(D.length)}</div>
      <div class="title"><h2>${s.name}</h2><span class="pill">${s.type}</span></div>
      <div class="meaning">معنی نام: ${s.meaning} · ${fa(s.verses)} آیه</div>

      <div class="msg">
        <div class="label">${icons.verses}<span>متن کامل سوره با ترجمه</span></div>
        <p>${s.message}</p>
      </div>

      ${body}
    </div>
  </article>`;
}

/* ============================================================
   LIST / RENDER / SWIPE / DRAWER
   ============================================================ */
function buildList(q = ""){
  const x = q.trim();
  const filtered = D.map((s,i) => ({s,i}))
    .filter(o => !x || o.s.name.includes(x) || o.s.meaning.includes(x));

  $("list").innerHTML = filtered.map(o => `
    <button class="item ${o.i === current ? "active" : ""}" data-i="${o.i}">
      <span class="num">${fa(o.i+1)}</span>
      <span><strong>${o.s.name}</strong><small>${o.s.meaning}</small></span>
    </button>`).join("");

  document.querySelectorAll(".item").forEach(btn => {
    btn.onclick = () => {
      current = Number(btn.dataset.i);
      render();
      closeDrawer();
      window.scrollTo({top:0,behavior:"smooth"});
    };
  });
}

function render(){
  $("deck").innerHTML = card(D[current], current);
  const pct = Math.round(((current+1) / D.length) * 100);
  $("counter").textContent = `سوره ${fa(current+1)} از ${fa(D.length)} · ${D[current].name}`;
  $("pct").textContent = fa(pct) + "٪";
  $("progress").style.width = pct + "%";
  buildList($("search").value);
  attachSwipe($("deck").firstElementChild);
}

function go(step){
  current = (current + step + D.length) % D.length;
  render();
}

function attachSwipe(el){
  if(!el) return;
  down = false; dx = 0;

  el.addEventListener("pointerdown", e => {
    if(mode === "verses" && e.target.closest(".ayah-list")) return;
    down = true; startX = e.clientX;
    el.setPointerCapture?.(e.pointerId);
    el.style.transition = "none";
  });

  el.addEventListener("pointermove", e => {
    if(!down) return;
    dx = e.clientX - startX;
    if(Math.abs(dx) > 8){
      const rot = dx / 18;
      const scale = 1 - Math.min(Math.abs(dx) / 2200, .055);
      const op = Math.max(.72, 1 - Math.abs(dx) / 550);
      el.style.transform = `translateX(${dx}px) rotate(${rot}deg) scale(${scale})`;
      el.style.opacity = op;
    }
  });

  el.addEventListener("pointerup", () => {
    if(!down) return;
    down = false;
    const threshold = 95;
    if(Math.abs(dx) >= threshold){
      const dir = dx < 0 ? 1 : -1;
      el.style.transition = "transform .36s cubic-bezier(.2,.8,.2,1),opacity .36s ease";
      el.style.transform = `translateX(${dir < 0 ? "125%" : "-125%"}) rotate(${dir < 0 ? "18deg" : "-18deg"})`;
      el.style.opacity = "0";
      setTimeout(() => {
        current = (current + dir + D.length) % D.length;
        render();
      },360);
    } else {
      el.style.transition = "transform .3s cubic-bezier(.2,.8,.2,1),opacity .25s ease";
      el.style.transform = "translateX(0) rotate(0deg) scale(1)";
      el.style.opacity = "1";
    }
    dx = 0;
  });

  el.addEventListener("pointercancel", () => {
    down = false;
    el.style.transition = "transform .3s ease,opacity .25s ease";
    el.style.transform = "translateX(0) rotate(0deg) scale(1)";
    el.style.opacity = "1";
    dx = 0;
  });
}

function openDrawer(){
  $("drawer").classList.add("open");
  $("overlay").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeDrawer(){
  $("drawer").classList.remove("open");
  $("overlay").classList.remove("open");
  document.body.style.overflow = "";
}

$("next").onclick = () => go(1);
$("prev").onclick = () => go(-1);
$("random").onclick = () => {
  let r;
  do { r = Math.floor(Math.random() * D.length); }
  while(r === current && D.length > 1);
  current = r;
  render();
};
$("open").onclick = openDrawer;
$("close").onclick = closeDrawer;
$("overlay").onclick = closeDrawer;
$("search").oninput = e => buildList(e.target.value);

document.onkeydown = e => {
  if(e.key === "ArrowLeft") go(1);
  if(e.key === "ArrowRight") go(-1);
  if(e.key === "Escape") closeDrawer();
};

render();

})();
</script>
