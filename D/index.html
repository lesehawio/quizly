<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fa4779">
<title>Quizly Pro | جزء ۳۰ - ویژه پیام نور</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');

:root{
  --bg:#fff7fa;
  --surface:#ffffff;
  --surface2:#fff0f5;
  --surface3:#fbe4ed;
  --text:#24151d;
  --muted:#765968;
  --soft:#a98a97;
  --pink:#fa4779;
  --pink2:#ff82a5;
  --pink3:#ffd1de;
  --line:#efd6df;
  --shadow:0 24px 70px rgba(161,43,82,.13);
  --glass:rgba(255,255,255,.78);
  --overlay:rgba(35,10,22,.48);
  --green:#22b573;
  --gold:#f5a623;
}

[data-theme="dark"]{
  --bg:#171117;
  --surface:#211a20;
  --surface2:#2d2229;
  --surface3:#382832;
  --text:#f8edf2;
  --muted:#c3a8b4;
  --soft:#9d7f8c;
  --pink:#ff5d8b;
  --pink2:#ff92b1;
  --pink3:#633143;
  --line:#45343d;
  --shadow:0 28px 80px rgba(0,0,0,.5);
  --glass:rgba(33,26,32,.82);
  --overlay:rgba(0,0,0,.68);
}

*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}

body{
  min-height:100vh;
  font-family:Vazirmatn,Tahoma,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 8% 8%,rgba(250,71,121,.11),transparent 27rem),
    radial-gradient(circle at 92% 80%,rgba(255,130,165,.10),transparent 30rem),
    var(--bg);
  background-attachment:fixed;
  transition:background .35s,color .35s;
}

button,input{font:inherit;}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;}

/* HEADER */
.top{
  position:fixed;
  z-index:40;
  top:14px;
  left:14px;
  right:14px;
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 12px;
  background:var(--glass);
  border:1px solid var(--line);
  border-radius:24px;
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:0 10px 35px rgba(80,20,45,.08);
}

.brand{display:flex;align-items:center;gap:10px;min-width:0;}

.brand img{
  width:44px;height:44px;border-radius:15px;object-fit:contain;
  box-shadow:0 7px 20px rgba(250,71,121,.2);
}

.brand span{
  font-size:13px;font-weight:900;white-space:nowrap;
  background:linear-gradient(135deg,var(--pink),var(--pink2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}

.actions{display:flex;gap:8px;}

.icon-btn{
  width:44px;height:44px;
  border:1px solid var(--line);
  border-radius:15px;
  background:var(--surface2);
  color:var(--text);
  display:grid;place-items:center;
  transition:.22s cubic-bezier(.2,.8,.2,1);
}

.icon-btn svg{width:19px;height:19px;fill:currentColor;}

.icon-btn:hover{
  transform:translateY(-2px);
  background:var(--pink);color:#fff;border-color:var(--pink);
  box-shadow:0 10px 24px rgba(250,71,121,.24);
}

/* MAIN */
main{width:min(860px,100%);margin:auto;padding:102px 18px 42px;}

.hero{text-align:center;padding:20px 0 12px;}

.tag{
  display:inline-flex;align-items:center;
  padding:7px 15px;border-radius:99px;
  background:var(--surface2);border:1px solid var(--line);
  color:var(--pink);font-size:10px;font-weight:800;
  box-shadow:0 7px 20px rgba(250,71,121,.06);
}

.hero h1{
  margin:11px 0 4px;
  font-size:clamp(28px,5vw,42px);
  line-height:1.2;font-weight:900;letter-spacing:-1.8px;
  background:linear-gradient(135deg,var(--pink),var(--pink2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}

.hero p{font-size:12px;color:var(--muted);font-weight:500;}

/* PROGRESS */
.progress-wrap{margin:18px 3px 0;}

.meta{
  display:flex;justify-content:space-between;align-items:center;
  color:var(--muted);font-size:11px;font-weight:700;
  margin:0 3px 7px;
}

.pct{color:var(--pink);font-weight:900;}

.bar{
  height:7px;background:var(--surface3);border-radius:99px;
  overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.06);
}

.bar i{
  display:block;height:100%;width:2.7%;border-radius:99px;
  background:linear-gradient(90deg,var(--pink),var(--pink2));
  transition:width .55s cubic-bezier(.15,.85,.3,1);
  box-shadow:0 0 14px rgba(250,71,121,.3);
}

/* MODE SWITCH */
.mode-bar{
  display:flex;gap:8px;margin:16px 0 10px;
  justify-content:center;flex-wrap:wrap;
}

.mode-btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:7px 17px;border:1px solid var(--line);
  border-radius:99px;background:var(--surface);
  color:var(--muted);font-size:10px;font-weight:700;
  transition:.2s;
}

.mode-btn svg{width:14px;height:14px;fill:currentColor;}

.mode-btn.active{
  background:var(--pink);color:#fff;border-color:var(--pink);
  box-shadow:0 7px 20px rgba(250,71,121,.2);
}

.mode-btn:hover{transform:translateY(-2px);}

/* DECK */
.deck{
  position:relative;min-height:680px;margin-top:10px;
  perspective:1400px;touch-action:none;overflow:visible;
}

.card{
  position:relative;border-radius:38px;overflow:hidden;
  background:var(--surface);border:1px solid var(--line);
  box-shadow:var(--shadow);user-select:none;display:flex;
  will-change:transform,opacity;backface-visibility:hidden;
  transform-origin:center center;
}

.card::before{
  content:"";position:absolute;border-radius:50%;pointer-events:none;
  width:330px;height:330px;top:-190px;left:-120px;
  background:radial-gradient(circle,var(--pink2),transparent 68%);
  opacity:.15;
}

.inside{
  position:relative;z-index:2;width:100%;
  padding:27px 28px 22px;display:flex;flex-direction:column;
}

.no{
  display:flex;align-items:center;gap:7px;
  color:var(--pink);font-size:10px;font-weight:900;
}

.no .dot{
  width:7px;height:7px;border-radius:50%;background:var(--pink);
  box-shadow:0 0 0 5px rgba(250,71,121,.1);
}

.title{display:flex;align-items:center;gap:10px;margin-top:5px;flex-wrap:wrap;}

.title h2{
  font-size:clamp(31px,6vw,43px);font-weight:900;letter-spacing:-1.5px;
}

.pill{
  padding:4px 12px;border-radius:99px;
  background:var(--surface2);border:1px solid var(--line);
  color:var(--muted);font-size:9px;font-weight:800;
}

.meaning{font-size:11px;color:var(--muted);margin-top:1px;}

.msg,.box,.key,.test-box,.verse-box{
  background:linear-gradient(145deg,var(--surface2),var(--surface));
  border:1px solid var(--line);
  box-shadow:0 8px 25px rgba(70,20,40,.035);
}

.msg{margin-top:17px;border-radius:25px;padding:17px 19px;}

.label{
  display:flex;align-items:center;gap:7px;
  color:var(--pink);font-size:10px;font-weight:900;
  margin-bottom:5px;
}

.label svg{width:15px;height:15px;fill:currentColor;}

.msg p{font-size:13px;line-height:2;font-weight:600;}

.cols{
  display:grid;grid-template-columns:1.2fr .8fr;
  gap:12px;margin-top:12px;
}

.box{border-radius:22px;padding:14px 15px;}

.box h3{
  display:flex;align-items:center;gap:6px;
  color:var(--pink);font-size:10px;margin-bottom:6px;font-weight:900;
}

.box h3 svg{width:14px;height:14px;fill:currentColor;}

.box p{
  font-size:10px;line-height:1.9;color:var(--muted);font-weight:600;
}

/* VERSES */
.verse-box{
  margin-top:12px;border-radius:22px;padding:14px 16px;
  border-right:4px solid var(--gold);
}

.verse-box h3{
  display:flex;align-items:center;gap:6px;
  color:var(--gold);font-size:10px;margin-bottom:5px;font-weight:900;
}

.verse-box h3 svg{width:14px;height:14px;fill:currentColor;}

.verse-box .v{
  font-size:12px;line-height:2.2;font-weight:600;color:var(--text);
}

/* TEST */
.test-box{
  margin-top:12px;border-radius:22px;padding:14px 16px;
  border-right:4px solid var(--green);
}

.test-box h3{
  display:flex;align-items:center;gap:6px;
  color:var(--green);font-size:10px;margin-bottom:5px;font-weight:900;
}

.test-box h3 svg{width:14px;height:14px;fill:currentColor;}

.test-box .q{font-size:12px;font-weight:700;line-height:2;}
.test-box .a{font-size:11px;color:var(--muted);line-height:1.8;}

.test-box .a strong{color:var(--green);font-weight:800;}

/* KEY */
.key{
  margin-top:12px;border-radius:21px;padding:13px 16px;
  border-style:dashed;border-color:var(--pink2);
}

.key b{
  display:flex;align-items:center;gap:7px;
  color:var(--pink);font-size:10px;
}

.key b svg{width:15px;height:15px;fill:currentColor;}

.key div{
  font-size:11px;line-height:1.8;margin-top:2px;font-weight:700;
}

/* QUICK MODE */
.card.quick-mode .msg{margin-top:14px;}
.card.quick-mode .cols{grid-template-columns:1fr;}
.card.quick-mode .box:last-child{display:none;}
.card.quick-mode .key{margin-top:10px;}

/* CONTROLS */
.hint{
  text-align:center;color:var(--soft);font-size:9px;
  margin:13px 0 7px;
}

.controls{
  display:flex;justify-content:center;align-items:center;gap:13px;
}

.ctrl{
  width:51px;height:51px;border:1px solid var(--line);
  border-radius:18px;background:var(--surface);color:var(--text);
  display:grid;place-items:center;
  box-shadow:0 8px 20px rgba(50,10,30,.06);
  transition:.22s;
}

.ctrl svg{width:20px;height:20px;fill:currentColor;}

.ctrl:hover{transform:translateY(-3px);background:var(--surface2);}

.ctrl.main{
  width:61px;height:61px;border:0;border-radius:21px;
  background:linear-gradient(145deg,var(--pink),var(--pink2));
  color:#fff;
  box-shadow:0 13px 32px rgba(250,71,121,.3);
}

.ctrl.main:hover{
  transform:translateY(-4px) scale(1.04);
  box-shadow:0 18px 40px rgba(250,71,121,.35);
}

.ctrl:active{transform:scale(.93);}

/* DRAWER */
.overlay{
  position:fixed;z-index:50;inset:0;background:var(--overlay);
  opacity:0;pointer-events:none;backdrop-filter:blur(4px);
  transition:.3s;
}

.overlay.open{opacity:1;pointer-events:auto;}

.drawer{
  position:fixed;z-index:60;top:0;right:0;
  height:100dvh;width:min(390px,91vw);
  background:var(--surface);border-left:1px solid var(--line);
  box-shadow:-25px 0 80px rgba(0,0,0,.2);
  transform:translateX(105%);
  transition:.42s cubic-bezier(.15,.85,.3,1);
  padding:22px;overflow:auto;
}

.drawer.open{transform:translateX(0);}

.dh{display:flex;align-items:center;justify-content:space-between;}
.dh h2{font-size:17px;font-weight:900;}

.close{
  width:43px;height:43px;border:0;border-radius:15px;
  background:var(--surface2);color:var(--text);
  display:grid;place-items:center;transition:.2s;
}

.close svg{width:20px;height:20px;fill:currentColor;}

.close:hover{background:var(--pink);color:#fff;transform:rotate(90deg);}

.search{
  width:100%;height:48px;margin:16px 0;
  border:1px solid var(--line);border-radius:17px;
  background:var(--surface2);color:var(--text);
  padding:0 16px;outline:0;font-size:11px;
}

.search:focus{
  border-color:var(--pink);
  box-shadow:0 0 0 4px rgba(250,71,121,.1);
}

.search::placeholder{color:var(--soft);}

.list{display:grid;gap:7px;}

.item{
  display:flex;align-items:center;gap:10px;width:100%;
  text-align:right;padding:10px 12px;
  border:1px solid var(--line);border-radius:17px;
  background:transparent;color:var(--text);transition:.2s;
}

.item:hover{background:var(--surface2);transform:translateX(-3px);}

.item.active{
  background:var(--surface2);border-color:var(--pink2);
  color:var(--pink);box-shadow:0 7px 22px rgba(250,71,121,.1);
}

.num{
  width:31px;height:31px;flex:0 0 31px;
  display:grid;place-items:center;border-radius:11px;
  background:var(--surface2);color:var(--pink);
  font-size:9px;font-weight:900;
}

.item strong{font-size:11px;font-weight:800;}

.item small{
  display:block;color:var(--soft);font-size:8px;
  margin-top:2px;font-weight:500;
}

/* MOBILE */
@media(max-width:600px){
  main{padding-left:12px;padding-right:12px;}
  .top{left:9px;right:9px;}
  .brand span{font-size:11px;}
  .deck{min-height:0;}
  .inside{padding:22px 19px 18px;}
  .cols{grid-template-columns:1fr 1fr;}
  .msg p{font-size:12px;}
  .box p{font-size:9px;}
}

@media(max-width:410px){
  .cols{grid-template-columns:1fr;}
  .hero h1{font-size:28px;}
  .inside{padding:20px 16px 16px;}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    scroll-behavior:auto!important;
    animation:none!important;
    transition:none!important;
  }
}
</style>
</head>

      <span>مرور سریع</span>

  <div class="deck" id="deck"></div>

  <div class="hint">

  <div class="controls">

    <button class="ctrl main" id="random" aria-label="تصادفی"></button>

  </div>

</main>

};

$("open").innerHTML = icons.menu;
$("close").innerHTML = icons.close;
$("prev").innerHTML = icons.right;
$("next").innerHTML = icons.left;
$("random").innerHTML = icons.shuffle;

let current = 0;
let down = false;
let startX = 0;
let dx = 0;
let mode = "full";

let dark = localStorage.getItem("quizly-theme") === "dark";

function theme(v){
  dark = v;
  document.documentElement.dataset.theme = v ? "dark" : "light";
  $("themeToggle").innerHTML = v ? icons.sun : icons.moon;
  localStorage.setItem("quizly-theme", v ? "dark" : "light");
}

theme(dark);
$("themeToggle").onclick = () => theme(!dark);

document.querySelectorAll(".mode-btn").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".mode-btn").forEach(x => x.classList.remove("active"));
    btn.classList.add("active");
    mode = btn.dataset.mode;
    render();
  };
});

function card(s,i){

  const vo = s.versesOrder || [];
  const sw = s.sharedWords || [];
  const uw = s.uniqueWords || [];
  const fullMode = mode === "full";

  return `
  <article class="card ${fullMode ? "" : "quick-mode"}">
    <div class="inside">

      <div class="no">
        <span class="dot"></span>
        سوره ${fa(i+1)} از ${fa(D.length)}
      </div>

      <div class="title">
        <h2>${s.name}</h2>
        <span class="pill">${s.type}</span>
      </div>

      <div class="meaning">
        معنی نام: ${s.meaning} · ${fa(s.verses)} آیه
      </div>

      <div class="msg">
        <div class="label">
          ${icons.message}
          <span>پیام اصلی سوره</span>
        </div>
        <p>${s.message}</p>
      </div>

      <div class="cols">
        <div class="box">
          <h3>${icons.info}<span>مشخصات سریع</span></h3>
          <p>شماره سوره: ${fa(s.n)}</p>
          <p>تعداد آیات: ${fa(s.verses)}</p>
          <p>نوع: ${s.type}</p>
          <p>اولین کلمه: ${s.firstWord}</p>
          <p>آخرین کلمه: ${s.lastWord}</p>
        </div>
        <div class="box">
          <h3>${icons.list}<span>موقعیت در مصحف</span></h3>
          <p>سورهٔ قبل: ${s.before}</p>
          <p>سورهٔ بعد: ${s.after}</p>
          ${s.prophets && s.prophets !== "—" ? `<p>پیامبران: ${s.prophets}</p>` : ""}
        </div>
      </div>

      ${fullMode && vo.length ? `
      <div class="verse-box">
        <h3>${icons.book}<span>آیات ابتدایی (۱ تا ۴)</span></h3>
        ${vo.map(v => `<div class="v">${v}</div>`).join("")}
      </div>` : ""}

      ${fullMode ? `
      <div class="verse-box" style="border-right-color:var(--pink)">
        <h3 style="color:var(--pink)">${icons.key}<span>آخرین آیهٔ سوره</span></h3>
        <div class="v">${s.lastVerse}</div>
      </div>` : ""}

      ${fullMode && sw.length ? `
      <div class="verse-box" style="border-right-color:var(--green)">
        <h3 style="color:var(--green)">${icons.list}<span>کلمات مشترک با سوره‌های دیگر</span></h3>
        ${sw.map(v => `<div class="v">• ${v}</div>`).join("")}
      </div>` : ""}

      ${fullMode && uw.length ? `
      <div class="verse-box" style="border-right-color:var(--gold)">
        <h3 style="color:var(--gold)">${icons.spark}<span>کلمات منحصربه‌فرد سوره</span></h3>
        <div class="v">${uw.join(" · ")}</div>
      </div>` : ""}

      ${fullMode && s.repeatWords && s.repeatWords !== "—" ? `
      <div class="test-box">
        <h3>${icons.help}<span>کلمات پرتکرار</span></h3>
        <div class="q">${s.repeatWords}</div>
      </div>` : ""}

      <div class="key">
        <b>${icons.key}<span>کلیدواژهٔ امتحانی</span></b>
        <div>${s.key}</div>
      </div>

    </div>
  </article>`;
}

function buildList(q = ""){
  const x = q.trim();
  const filtered = D.map((s,i) => ({s,i}))
    .filter(o => !x || o.s.name.includes(x) || o.s.meaning.includes(x));

  $("list").innerHTML = filtered.map(o => `
    <button class="item ${o.i === current ? "active" : ""}" data-i="${o.i}">
      <span class="num">${fa(o.i+1)}</span>
      <span>
        <strong>${o.s.name}</strong>
        <small>${o.s.meaning}</small>
      </span>
    </button>`).join("");

  document.querySelectorAll(".item").forEach(btn => {
    btn.onclick = () => {
      current = Number(btn.dataset.i);
      render();
      closeDrawer();
      window.scrollTo({top:0,behavior:"smooth"});
    };
  });
}

function render(){
  $("deck").innerHTML = card(D[current], current);

  const pct = Math.round(((current+1) / D.length) * 100);

  $("counter").textContent = `سوره ${fa(current+1)} از ${fa(D.length)} · ${D[current].name}`;
  $("pct").textContent = fa(pct) + "٪";
  $("progress").style.width = pct + "%";

  buildList($("search").value);
  attachSwipe($("deck").firstElementChild);
}

function go(step){
  current = (current + step + D.length) % D.length;
  render();
}

function attachSwipe(el){
  if(!el) return;
  down = false; dx = 0;

  el.addEventListener("pointerdown", e => {
    down = true; startX = e.clientX;
    el.setPointerCapture?.(e.pointerId);
    el.style.transition = "none";
  });

  el.addEventListener("pointermove", e => {
    if(!down) return;
    dx = e.clientX - startX;
    if(Math.abs(dx) > 8){
      const rot = dx / 18;
      const scale = 1 - Math.min(Math.abs(dx) / 2200, .055);
      const op = Math.max(.72, 1 - Math.abs(dx) / 550);
      el.style.transform = `translateX(${dx}px) rotate(${rot}deg) scale(${scale})`;
      el.style.opacity = op;
    }
  });

  el.addEventListener("pointerup", () => {
    if(!down) return;
    down = false;
    const threshold = 95;

    if(Math.abs(dx) >= threshold){
      const dir = dx < 0 ? 1 : -1;
      el.style.transition = "transform .36s cubic-bezier(.2,.8,.2,1),opacity .36s ease";
      el.style.transform = `translateX(${dir < 0 ? "125%" : "-125%"}) rotate(${dir < 0 ? "18deg" : "-18deg"})`;
      el.style.opacity = "0";
      setTimeout(() => {
        current = (current + dir + D.length) % D.length;
        render();
      },360);
    } else {
      el.style.transition = "transform .3s cubic-bezier(.2,.8,.2,1),opacity .25s ease";
      el.style.transform = "translateX(0) rotate(0deg) scale(1)";
      el.style.opacity = "1";
    }
    dx = 0;
  });

  el.addEventListener("pointercancel", () => {
    down = false;
    el.style.transition = "transform .3s ease,opacity .25s ease";
    el.style.transform = "translateX(0) rotate(0deg) scale(1)";
    el.style.opacity = "1";
    dx = 0;
  });
}

function openDrawer(){
  $("drawer").classList.add("open");
  $("overlay").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeDrawer(){
  $("drawer").classList.remove("open");
  $("overlay").classList.remove("open");
  document.body.style.overflow = "";
}

$("next").onclick = () => go(1);
$("prev").onclick = () => go(-1);
$("random").onclick = () => {
  let r;
  do { r = Math.floor(Math.random() * D.length); }
  while(r === current && D.length > 1);
  current = r;
  render();
};
$("open").onclick = openDrawer;
$("close").onclick = closeDrawer;
$("overlay").onclick = closeDrawer;
$("search").oninput = e => buildList(e.target.value);

document.onkeydown = e => {
  if(e.key === "ArrowLeft") go(1);
  if(e.key === "ArrowRight") go(-1);
  if(e.key === "Escape") closeDrawer();
};

render();

})();
</script>

</body>
</html>
