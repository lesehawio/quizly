<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>آزمون مرور سریع - اندازه‌گیری و ارزشیابی آموزشی (نسخه ۸)</title>
    <style>
        :root {
            --pink: #fa4779;
            --pink2: #ff7aa6;
            --pink-soft: rgba(250, 71, 121, 0.12);
            --bg: #f6f7fb;
            --card: #ffffff;
            --text: #0f172a;
            --border: #e5e7eb;
            --correct: #7fd1b9;
        }
        body.dark {
            --bg: #0b1020;
            --card: #131a33;
            --text: #e5e7eb;
            --border: #263056;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
        }
        .theme-toggle {
            position: fixed;
            top: 14px;
            left: 14px;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: var(--card);
            border: 1px solid var(--border);
            cursor: pointer;
            z-index: 10;
            font-size: 20px;
        }
        .wrapper {
            max-width: 1200px;
            margin: 70px auto;
            display: grid;
            grid-template-columns: 1fr 420px;
            gap: 26px;
        }
        .card, .sheet, .json-card {
            background: var(--card);
            border-radius: 28px;
            padding: 28px;
            box-shadow: 0 25px 55px rgba(0, 0, 0, 0.18);
        }
        .json-card { grid-column: 1 / -1; margin-top: 10px; }
        .progress-wrap {
            height: 12px;
            background: linear-gradient(90deg, #eee, #ddd);
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 28px;
        }
        .progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(135deg, var(--pink), var(--pink2));
            transition: .4s;
        }
        .question {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 22px;
            line-height: 1.8;
        }
        .options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }
        .option {
            padding: 16px 18px;
            border-radius: 22px;
            border: 1px solid var(--border);
            cursor: pointer;
            text-align: center;
            font-weight: 500;
            transition: background .3s, border-color .3s;
            font-size: 15px;
        }
        .option:hover {
            background: var(--pink-soft);
            border-color: var(--pink);
        }
        .next {
            margin-top: 28px;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 22px;
            background: linear-gradient(135deg, var(--pink), var(--pink2));
            color: #fff;
            cursor: pointer;
            display: none;
            font-size: 16px;
            font-weight: 600;
            transition: background .3s;
        }
        .next:hover { background: var(--pink2); }
        .sheet { max-height: 620px; overflow: auto; }
        .sheet-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .sheet-cell {
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 10px 12px;
            display: grid;
            grid-template-columns: 30px 1fr;
            gap: 8px;
            align-items: center;
        }
        .sheet-cell.active {
            border-color: var(--pink);
            box-shadow: 0 0 0 3px var(--pink-soft);
        }
        .answers { display: flex; justify-content: space-between; }
        .bubble {
            width: 28px;
            height: 28px;
            border-radius: 999px;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 12px;
        }
        .bubble.correct { background: var(--correct); color: #fff; border: none; }
        .bubble.wrong { background: var(--pink); color: #fff; border: none; }
        .result { text-align: center; margin-top: 40px; }
        .score { font-size: 48px; font-weight: 900; color: var(--pink); }
        .desc { margin-top: 10px; font-size: 20px; font-weight: 600; }
        .print {
            margin-top: 24px;
            padding: 14px 34px;
            border-radius: 999px;
            border: none;
            background: #111;
            color: #fff;
            cursor: pointer;
            font-size: 15px;
            transition: background .3s;
        }
        .print:hover { background: #333; }
        .json-card textarea {
            width: 100%;
            min-height: 160px;
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 14px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            background: var(--bg);
            color: var(--text);
            resize: vertical;
            direction: ltr;
            text-align: left;
        }
        .json-card .json-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .json-card .json-header h3 { margin: 0; font-size: 18px; }
        .copy-json-btn {
            padding: 8px 24px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, var(--pink), var(--pink2));
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform .2s, box-shadow .2s;
        }
        .copy-json-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 20px rgba(250, 71, 121, 0.35);
        }
        .copy-feedback {
            font-size: 14px;
            color: var(--correct);
            font-weight: 600;
            display: none;
        }
        .quizly-logo {
            position: fixed;
            top: 16px;
            right: 18px;
            z-index: 999;
        }
        .quizly-logo img {
            width: 60px;
            cursor: pointer;
            animation: quizlyFloat 4s ease-in-out infinite;
            filter: drop-shadow(0 10px 28px rgba(250, 71, 121, .55));
            transition: transform .35s ease, filter .35s ease;
        }
        .quizly-logo img:hover {
            transform: scale(1.12) rotate(3deg);
            filter: drop-shadow(0 16px 40px rgba(250, 71, 121, .85));
        }
        @keyframes quizlyFloat {
            0%   { transform: translateY(0); }
            50%  { transform: translateY(-6px); }
            100% { transform: translateY(0); }
        }
        @media (max-width: 820px) {
            .wrapper { grid-template-columns: 1fr; }
            .options { grid-template-columns: 1fr; }
            .sheet-grid { grid-template-columns: 1fr 1fr; }
        }
        @media print {
            .theme-toggle, .next, .json-card { display: none; }
            body { background: #fff; }
        }
    </style>
</head>
<body>
<div class="quizly-logo">
    <img src="https://cdn.imgurl.ir/uploads/j893448_Quizly.png" alt="Quizly Logo">
</div>

<button class="theme-toggle" onclick="toggleTheme()">🌓</button>

<div class="wrapper">
    <div class="card">
        <div class="progress-wrap">
            <div class="progress" id="progress"></div>
        </div>
        <div id="quiz"></div>
        <button class="next" id="nextBtn" onclick="next()">بعدی</button>
        <div class="result" id="result"></div>
    </div>
    <div class="sheet">
        <div class="sheet-grid" id="sheet"></div>
    </div>

    <!-- بخش JSON -->
    <div class="json-card" id="jsonCard">
        <div class="json-header">
            <h3>📋 کپی JSON نتایج</h3>
            <div>
                <button class="copy-json-btn" onclick="copyJSON()">کپی JSON</button>
                <span class="copy-feedback" id="copyFeedback">✓ کپی شد!</span>
            </div>
        </div>
        <textarea id="jsonOutput" readonly placeholder="نتایج به‌صورت JSON اینجا نمایش داده می‌شود..."></textarea>
    </div>
</div>

<script>

const questions = [
    {
        q: "در کدام اصطلاح ویژگیها یا صفات به صورت عدد یا رقم گزارش می شود؟",
        options: ["ارزشیابی", "اندازه گیری", "آزمون", "سنجش"],
        answer: 1
    },
    {
        q: "کدام اصطلاح با مفهوم عموماً به منظور حل مشکلات عمل ویژه و کمک به تصمیم گیری صورت می گیرد؟",
        options: ["ارزشیابی", "اندازه گیری", "آزمون", "سنجش"],
        answer: 0
    },
    {
        q: "کدام گزینه نمایانگر ساده ترین سطح اندازه گیری می باشد؟",
        options: ["مقیاس ترتیبی", "مقیاس فاصله ای", "مقیاس نسبتی", "مقیاس اسمی"],
        answer: 3
    },
    {
        q: "کدام عملیات ریاضی برای مقیاس فاصله ای مجاز می باشد؟",
        options: ["تناسب", "تقسیم", "ضرب", "جمع و تفریق"],
        answer: 3
    },
    {
        q: "کدام عملیات آماری برای مقیاس اسمی مجاز می باشد؟",
        options: ["میانه", "ضریب همبستگی", "نما", "واریانس"],
        answer: 2
    },
    {
        q: "کدام متغیر زیر معرف مقیاس گسسته می باشد؟",
        options: ["جنس", "هوش", "وزن", "زمان"],
        answer: 0
    },
    {
        q: "معمولاً هدفهای آموزشی در دو سطح بیان می شوند. آنها کدامند؟",
        options: ["غائی و دقیق", "جزئی و دقیق", "کلی و جزئی", "جزئی و رفتاری"],
        answer: 2
    },
    {
        q: "غالباً طرحهای پژوهشی به دو گونه تقسیم می شوند. آنها کدامند؟",
        options: ["کلی و جزئی", "آزمایشی و شبه آزمایشی", "فرایندی و فراورده ای", "آموزشی وپرورزه ای"],
        answer: 1
    },
    {
        q: "هر سوال چند گزینه ای از سه قسمت اصلی تشکیل می یابد. در این رابطه کدام گزینه غلط می باشد؟",
        options: ["گزینه درست", "گزینه های انحرافی", "تنه سوال", "هدف سوال"],
        answer: 3
    },
    {
        q: "سوالهای چندگزینه ای از نوع بهترین گزینه در کدامیک از موارد زیر مفیدند؟",
        options: ["ریاضیات", "فیزیک", "علوم انسانی", "علوم طبیعی"],
        answer: 2
    },
    {
        q: "در رابطه با قواعد تهیه سوالهای چندگزینه ای کدام گزینه غلط می باشد؟",
        options: ["هر سوال یک هدف آموزشی را اندازه بگیرد", "نصف مطالب اصلی سوال را در تنه سوال بنویسید", "سوالها را کاملاً در حد درک آزمون شوندگان بنویسید", "از تکرار مطالب در گزینه ها خودداری کنید"],
        answer: 1
    },
    {
        q: "به نظر مهرنز و لمنن سوالهای ۴ تا ۵ گزینه ای از کدام پایه برای دانش آموزان مناسب می باشند؟",
        options: ["سوم", "چهارم", "پنجم", "ششم"],
        answer: 3
    },
    {
        q: "کدام گزینه از محدودیت های آزمونهای چندگزینه ای محسوب نمی شود؟",
        options: ["نسبت به سایر آزمونها انعطاف پذیری کمتری دارند", "ساختن این آزمونها بسیار دشوار است", "اغلب معلمان سوالهای چند گزینه ای را در حد سنجش اطلاعات کم اهمیت می نویسند", "زمانیکه به پاسخهای غلط نمره منفی داده می شود دانش آموزانی که خطر می کنند از سایرین نمره های بهتری می گیرند"],
        answer: 1
    },
    {
        q: "در رابطه با تهیه قواعد تهیه سوالهای تشریحی کدام گزینه غلط می باشد؟",
        options: ["تاحد امکان از سوالهای تازه و موقعیتهای جدید استفاده کنید", "برای تکمیل آزمونهای تشریحی از روش کارپوشه استفاده کنید", "از کاربرد کلمات چرا، چگونه، به چه دلیل بپرهیزید", "برای پاسخ دادن به سوالها زمان کافی در نظر بگیرید"],
        answer: 2
    },
    {
        q: "کدامیک از افراد زیر پیشنهاد می کند که اگر تصحیح همه برگه های سوالهای تشریحی توسط سایر اشخاص ممکن نیست دست کم نمونه ای از آنها را برای تصحیح به فرد دیگری واگذار کنید؟",
        options: ["آیل", "پیچ", "نیتکو", "ساکس"],
        answer: 0
    },
    {
        q: "کدام گزینه از محدودیت های آزمونهای تشریحی محسوب نمی شود؟",
        options: ["نمونه کوچکی از محتوای درس را اندازه می گیرد", "بر روش مطالعه یادگیرندگان تاثیر منفی به جای می گذارد", "تصحیح پاسخهای آنان نمی تواند با دقت و عینیت انجام گیرد", "تصحیح پاسخهای آنان بسیار وقت گیر است"],
        answer: 1
    },
    {
        q: "به کدامیک از روشهای سنجش عملکردی نیتکو (۲۰۰۱) روش تکالیف عملکردی نوعی نیز گفته می شود؟",
        options: ["کارپوشه", "پروژه های طولانی مدت", "سنجش ساختارمند", "سنجش در موقعیتهای طبیعی"],
        answer: 3
    },
    {
        q: "کدام گزینه از انواع هوش مورد اشاره گاردنر می باشد؟",
        options: ["طبیعت گرایانه", "فلسفی-دینی", "هنری", "بین المللی"],
        answer: 0
    },
    {
        q: "کدام گزینه از قواعد تهیه مقیاس درجه بندی می باشد؟",
        options: ["ویژگیهای مورد ارزشیابی را به گونه ای بیان کنید که مستقیماً غیر مستقیم قابل مشاهده باشد", "فقط خودتان رفتارها یا محصولات موردنظرتان را مشاهده و ارزشیابی نمایید", "شماره درجات مقیاس را بین ۴ تا ۷ برگزینید", "درجه بندی را بدون اطلاع از نام دانش آموز انجام دهید"],
        answer: 3
    },
    {
        q: "بزرگترین مشکل مقیاس درجه بندی کدام است؟",
        options: ["نمره گذاری توسط آزمایان کم تجربه", "احتمال تاثیر تعصبات و سوگیریهای ارزیاب", "کاربرد اصطلاحات و صفات کلی و مبهم", "بکارگیری بازده ی یادگیری از پیش مشخص شده"],
        answer: 2
    },
    {
        q: "کدام گزینه از محدودیتهای سنجش مشاهده ای نفی می باشد؟",
        options: ["فقط اطلاعات کیفی بدست می دهند", "مشاهدات محدود همیشه نمی تواند علتهای رفتار را نشان دهد", "ثبت مشاهده همزمان با انجام مشاهده کار بسیار دشواری است", "استنتاجهای ناشی از مشاهدات را باید بسیار احتمالی تلقی کرد"],
        answer: 0
    },
    {
        q: "مدتی که طول می کشد تا شخص انجام کار یا رفتاری را که از او خواسته شده است شروع کند نمایانگر کدام بعد رفتار می باشد؟",
        options: ["نهفتگی", "نیرو", "مدت", "موقعیت"],
        answer: 0
    },
    {
        q: "تعداد دفعات وقوع رفتار نمایانگر کدام بعد آن است؟",
        options: ["ظاهر", "نرخ", "شدت", "موقعیت"],
        answer: 1
    },
    {
        q: "کوهن و سوردلیک به جای آزمون موقعیتی کدام اصطلاح زیر را به کار برده اند؟",
        options: ["پژوهش موقعیتی", "پژوهش عملکرد موقعیتی", "اندازه گیری موقعیتی", "اندازه گیری عملکرد موقعیتی"],
        answer: 2
    },
    {
        q: "مشکل عمده روشهای نظارت شخصی و عملکرد شخصی کدام است؟",
        options: ["صرف وقت زیاد", "صرف نیروی زیاد", "نبود صداقت", "عدم امکان ضبط رویدادها"],
        answer: 2
    },
    {
        q: "هر ویژگی عاطفی باید دارای سه ملاک خاص باشد. در این رابطه کدام گزینه غلط می باشد؟",
        options: ["سطح", "شدت", "جهت", "هدف"],
        answer: 0
    },
    {
        q: "کدام اصطلاح زیر بر دانش واقعیتها تاکید دارد و برای سنجش متغیرهای شناختی مفیدتر است؟",
        options: ["عقیده سنجی", "پرسشنامه", "مشاهده", "گزارش شخصی"],
        answer: 1
    },
    {
        q: "آزگود و همکاران در نتایج حاصل از بررسی تحلیل عاملی روش تفکیک معنایی سه عامل عمده را بدست آوردند. در این رابطه کدام گزینه غلط می باشد؟",
        options: ["فعالیت", "توانمندی", "ارزشیابی", "محتوا"],
        answer: 3
    },
    {
        q: "بازنمایی نموداری از روابط اجتماعی درون گروه یا ساختار گروه چه نام دارد؟",
        options: ["گروه سنجی", "پذیرش گروهی", "پویایی گروه", "نگاره گروه"],
        answer: 3
    },
    {
        q: "پرسشنامه کیفیت زندگی در مدرسه از چند ماده (سوال) تشکیل شده است؟",
        options: ["۳۵ ماده", "۳۶ ماده", "۳۸ ماده", "۳۹ ماده"],
        answer: 3
    }
];

    let index = 0;
    let correctCount = 0;
    const userAnswers = Array(questions.length).fill(null);
    const letters = ["الف", "ب", "ج", "د"];

    const quiz = document.getElementById("quiz");
    const sheet = document.getElementById("sheet");
    const nextBtn = document.getElementById("nextBtn");
    const progress = document.getElementById("progress");
    const jsonOutput = document.getElementById("jsonOutput");
    const copyFeedback = document.getElementById("copyFeedback");

    function render() {
        const q = questions[index];
        quiz.innerHTML = `
            <div class="question">${index+1}. ${q.q}</div>
            <div class="options">
                ${q.options.map((o, i) => `<div class="option" onclick="select(${i})">${letters[i]}) ${o}</div>`).join("")}
            </div>`;
        nextBtn.style.display = "none";
        updateProgress();
        renderSheet();
        updateJSON();
    }

    function updateProgress() {
        progress.style.width = `${(index / questions.length) * 100}%`;
    }

    function renderSheet() {
        sheet.innerHTML = questions.map((q, i) => {
            const ua = userAnswers[i];
            return `
                <div class="sheet-cell ${i === index ? "active" : ""}">
                    <b>${i + 1}</b>
                    <div class="answers">
                        ${[0, 1, 2, 3].map((j) => {
                            let c = "";
                            if (ua !== null) {
                                c = j === q.answer ? "correct" : (j === ua ? "wrong" : "");
                            }
                            return `<div class="bubble ${c}">${letters[j]}</div>`;
                        }).join("")}
                    </div>
                </div>`;
        }).join("");
    }

    function select(i) {
        if (userAnswers[index] !== null) return;
        userAnswers[index] = i;
        if (i === questions[index].answer) correctCount++;
        nextBtn.style.display = "block";
        renderSheet();
        updateJSON();
    }

    function next() {
        index++;
        if (index < questions.length) {
            render();
        } else {
            finish();
        }
    }

    function finish() {
        progress.style.width = "100%";
        const totalQuestions = questions.length;
        const answeredQuestions = userAnswers.filter(answer => answer !== null).length;
        const grade = ((correctCount / totalQuestions) * 20).toFixed(2);
        const percentage = ((correctCount / totalQuestions) * 100).toFixed(2);
        let desc = "";
        if (grade >= 18) desc = "عالی و مسلط";
        else if (grade >= 15) desc = "خوب";
        else if (grade >= 12) desc = "قابل قبول";
        else desc = "نیازمند تمرین جدی";

        quiz.innerHTML = `
            <div class="score">${grade} / ۲۰</div>
            <div class="desc">${desc}</div>
            <div>شما ${answeredQuestions} از ${totalQuestions} سوال را پاسخ داده‌اید. (${percentage}%)</div>
            <div style="margin-top:10px;color:var(--text-secondary);font-size:14px;">
                ✅ ${correctCount} صحیح | ❌ ${answeredQuestions - correctCount} غلط
            </div>
            <button class="print" onclick="openPrintWindow()">🖨 چاپ</button>
        `;
        updateJSON();
    }

    function openPrintWindow() {
        const printWindow = window.open('', '_blank');
        printWindow.document.write(`
            <html lang="fa" dir="rtl">
            <head>
                <meta charset="UTF-8">
                <title>نتیجه آزمون</title>
                <style>
                    body { font-family: 'Vazirmatn', Tahoma, sans-serif; direction: rtl; padding: 20px; }
                    .result { text-align: center; margin: 20px; }
                    .table { width: 100%; border-collapse: collapse; margin-top: 20px; }
                    .table th, .table td { border: 1px solid #ddd; padding: 10px; text-align: center; }
                    .table th { background: #fa4779; color: #fff; }
                    .table td.correct { background: #7fd1b9; }
                    .table td.wrong { background: #fa4779; color: #fff; }
                </style>
            </head>
            <body>
                <div class="result">
                    <h1>نتیجه آزمون</h1>
                    <div style="font-size:48px;font-weight:900;color:#fa4779;">${(correctCount / questions.length * 20).toFixed(2)} / ۲۰</div>
                    <div>شما ${userAnswers.filter(answer => answer !== null).length} از ${questions.length} سوال را پاسخ داده‌اید.</div>
                    <table class="table">
                        <thead>
                            <tr><th>سوال</th><th>پاسخ شما</th><th>پاسخ صحیح</th></tr>
                        </thead>
                        <tbody>
                            ${questions.map((q, i) => `
                                <tr>
                                    <td>${q.q}</td>
                                    <td class="${userAnswers[i] === q.answer ? 'correct' : 'wrong'}">${userAnswers[i] !== null ? letters[userAnswers[i]] : 'پاسخ داده نشده'}</td>
                                    <td>${letters[q.answer]}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            </body>
            </html>
        `);
        printWindow.document.close();
        printWindow.focus();
        printWindow.print();
        printWindow.close();
    }

    function toggleTheme() {
        document.body.classList.toggle("dark");
    }

    // ===== JSON GENERATOR =====
    function generateJSON() {
        const totalQuestions = questions.length;
        const answered = userAnswers.filter(a => a !== null).length;
        const correct = correctCount;
        const wrong = answered - correct;
        const grade = ((correct / totalQuestions) * 20);
        const percentage = ((correct / totalQuestions) * 100);

        const results = questions.map((q, i) => {
            const userAns = userAnswers[i];
            return {
                question_number: i + 1,
                question: q.q,
                options: q.options,
                correct_answer: letters[q.answer],
                user_answer: userAns !== null ? letters[userAns] : "پاسخ داده نشده",
                is_correct: userAns !== null ? (userAns === q.answer) : false
            };
        });

        return {
            total_questions: totalQuestions,
            answered_questions: answered,
            correct_answers: correct,
            wrong_answers: wrong,
            grade: parseFloat(grade.toFixed(2)),
            percentage: parseFloat(percentage.toFixed(2)),
            results: results
        };
    }

    function updateJSON() {
        const data = generateJSON();
        jsonOutput.value = JSON.stringify(data, null, 2);
    }

    function copyJSON() {
        jsonOutput.select();
        navigator.clipboard.writeText(jsonOutput.value).then(() => {
            copyFeedback.style.display = "inline";
            setTimeout(() => { copyFeedback.style.display = "none"; }, 2000);
        }).catch(() => {
            document.execCommand("copy");
            copyFeedback.style.display = "inline";
            setTimeout(() => { copyFeedback.style.display = "none"; }, 2000);
        });
    }

    render();
</script>
</body>
</html>
